name: Smart Retail CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies (OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx httpx2 pytest pytest-cov

    - name: Generate Training Data & Models
      env:
        NLTK_DISABLE_IMPORT_SECURITY: "1"
      run: |
        python data/generate_synthetic_data.py
        python app/models/train_sentiment_model.py
        python app/models/train_chatbot_model.py
        python app/models/train_face_recognizer.py
        python app/models/train_product_classifier.py

    - name: Run Test Suite (pytest)
      env:
        NLTK_DISABLE_IMPORT_SECURITY: "1"
      run: |
        python -m pytest tests/

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: smart-retail-ai:latest
